<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRIVO - Dari Petani, Untuk Indonesia</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        agrivo: {
                            50: '#fef2f2',
                            100: '#fee2e2',
                            200: '#fecaca',
                            300: '#fca5a5',
                            400: '#f87171',
                            500: '#ef4444',
                            600: '#dc2626',
                            700: '#b91c1c',
                            800: '#991b1b',
                            900: '#7f1d1d',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // 1. MOCK DATA LAYER (Simulating PostgreSQL/Laravel API)
        // ==========================================
        
        const MOCK_USERS = {
            buyer: { id: 'u1', name: 'Ahmad Pembeli', role: 'BUYER', avatar: 'https://i.pravatar.cc/150?u=u1' },
            seller: { id: 'u2', name: 'Pak Budi Farm', role: 'SELLER', avatar: 'https://i.pravatar.cc/150?u=u2', verified: true, location: 'Sidoarjo' },
            admin: { id: 'u3', name: 'Admin AGRIVO', role: 'ADMIN', avatar: 'https://i.pravatar.cc/150?u=u3' }
        };

        let MOCK_PRODUCTS = [
            { id: 'p1', sellerId: 'u2', sellerName: 'Pak Budi Farm', name: 'Cabai Merah Besar Premium', category: 'Cabai', price: 28000, unit: 'kg', stock: 500, minOrder: 10, location: 'Sidoarjo, Jawa Timur', rating: 4.9, image: 'https://images.unsplash.com/photo-1588880196853-53372c019d9b?auto=format&fit=crop&q=80&w=800', description: 'Cabai merah besar segar langsung dari kebun. Cocok untuk industri makanan dan restoran. Dipanen setiap pagi.', status: 'APPROVED' },
            { id: 'p2', sellerId: 'u2', sellerName: 'Tani Makmur', name: 'Jagung Pipilan Kering', category: 'Jagung', price: 6500, unit: 'kg', stock: 2000, minOrder: 50, location: 'Mojokerto, Jawa Timur', rating: 4.8, image: 'https://images.unsplash.com/photo-1601648764658-cf37e8c89b70?auto=format&fit=crop&q=80&w=800', description: 'Jagung pipilan kering kadar air 15%. Cocok untuk pakan ternak.', status: 'APPROVED' },
            { id: 'p3', sellerId: 'u4', sellerName: 'Sumber Rejeki', name: 'Beras Premium Mentik Wangi', category: 'Padi & Beras', price: 15000, unit: 'kg', stock: 1000, minOrder: 25, location: 'Jember, Jawa Timur', rating: 5.0, image: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&q=80&w=800', description: 'Beras premium tanpa pemutih dan pewangi buatan. Pulen dan wangi alami.', status: 'APPROVED' },
            { id: 'p4', sellerId: 'u5', sellerName: 'Agro Sejahtera', name: 'Tomat Segar Grade A', category: 'Sayuran', price: 12000, unit: 'kg', stock: 800, minOrder: 20, location: 'Malang, Jawa Timur', rating: 4.7, image: 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?auto=format&fit=crop&q=80&w=800', description: 'Tomat segar pilihan dari dataran tinggi Malang.', status: 'APPROVED' },
            { id: 'p5', sellerId: 'u6', sellerName: 'Mitra Tani Jaya', name: 'Pupuk NPK Mutiara', category: 'Pupuk', price: 350000, unit: 'sak', stock: 100, minOrder: 1, location: 'Surabaya, Jawa Timur', rating: 4.9, image: 'https://images.unsplash.com/photo-1628543105315-9988b49e1a38?auto=format&fit=crop&q=80&w=800', description: 'Pupuk NPK lengkap untuk masa vegetatif dan generatif.', status: 'APPROVED' },
        ];

        let MOCK_ORDERS = [
            { id: 'AGR-2026-000001', buyerId: 'u1', sellerId: 'u2', productId: 'p1', productName: 'Cabai Merah Besar Premium', qty: 50, price: 28000, subtotal: 1400000, fee: 10000, total: 1410000, status: 'PROCESSING', date: '2026-09-10' },
            { id: 'AGR-2026-000002', buyerId: 'u1', sellerId: 'u4', productId: 'p3', productName: 'Beras Premium Mentik Wangi', qty: 100, price: 15000, subtotal: 1500000, fee: 15000, total: 1515000, status: 'COMPLETED', date: '2026-09-01' }
        ];

        let MOCK_CHATS = [
            { id: 'c1', orderId: null, buyerId: 'u1', sellerId: 'u2', messages: [
                { senderId: 'u1', text: 'Pak, kalau ambil 500 kg harganya bisa kurang?', time: '10:00' },
                { senderId: 'u2', text: 'Bisa mas, kalau 500 kg saya kasih Rp26.000/kg.', time: '10:05' }
            ]}
        ];

        // ==========================================
        // 1.5. GEMINI AI INTEGRATION
        // ==========================================
        const geminiApi = {
            generateContent: async (contents, systemInstruction) => {
                const apiKey = ""; // Canvas runtime injects key here
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                const payload = { contents };
                if (systemInstruction) {
                    payload.systemInstruction = { parts: [{ text: systemInstruction }] };
                }

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    return result?.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf, terjadi kesalahan pemrosesan AI.";
                } catch (error) {
                    console.error("Gemini Error:", error);
                    return "Gagal terhubung ke layanan AI AGRIVO.";
                }
            }
        };

        // API Service Simulation
        const api = {
            getProducts: async (search = '', category = '') => {
                return MOCK_PRODUCTS.filter(p => 
                    (p.name.toLowerCase().includes(search.toLowerCase()) || p.category.toLowerCase().includes(search.toLowerCase())) &&
                    (category ? p.category === category : true)
                );
            },
            getProductById: async (id) => MOCK_PRODUCTS.find(p => p.id === id),
            createOrder: async (orderData) => {
                const newOrder = {
                    id: `AGR-2026-${String(MOCK_ORDERS.length + 1).padStart(6, '0')}`,
                    ...orderData,
                    status: 'PENDING',
                    date: new Date().toISOString().split('T')[0]
                };
                MOCK_ORDERS.unshift(newOrder);
                return newOrder;
            },
            getOrdersByUser: async (userId, role) => {
                return MOCK_ORDERS.filter(o => role === 'BUYER' ? o.buyerId === userId : o.sellerId === userId);
            },
            updateOrderStatus: async (orderId, newStatus) => {
                const order = MOCK_ORDERS.find(o => o.id === orderId);
                if(order) order.status = newStatus;
                return order;
            }
        };

        // ==========================================
        // 2. REUSABLE UI COMPONENTS
        // ==========================================

        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        };

        const Badge = ({ children, type = 'default' }) => {
            const colors = {
                success: 'bg-green-100 text-green-800',
                warning: 'bg-yellow-100 text-yellow-800',
                danger: 'bg-red-100 text-red-800',
                info: 'bg-blue-100 text-blue-800',
                default: 'bg-gray-100 text-gray-800'
            };
            return <span className={`px-2 py-1 text-xs font-medium rounded-full ${colors[type]}`}>{children}</span>;
        };

        const Button = ({ children, variant = 'primary', className = '', onClick, disabled }) => {
            const baseStyle = "inline-flex items-center justify-center px-4 py-2 font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-agrivo-600 hover:bg-agrivo-700 text-white focus:ring-agrivo-500",
                secondary: "bg-agrivo-50 hover:bg-agrivo-100 text-agrivo-700 focus:ring-agrivo-500",
                outline: "border border-gray-300 bg-white hover:bg-gray-50 text-gray-700 focus:ring-agrivo-500",
                danger: "bg-red-600 hover:bg-red-700 text-white focus:ring-red-500"
            };
            return (
                <button disabled={disabled} onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

        const ProductCard = ({ product, onClick }) => (
            <div onClick={onClick} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow cursor-pointer flex flex-col h-full group">
                <div className="relative h-48 overflow-hidden bg-gray-100">
                    <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                    <div className="absolute top-2 right-2 bg-white/90 backdrop-blur-sm px-2 py-1 rounded-lg text-xs font-bold text-gray-700 flex items-center shadow-sm">
                        <i className="fa-solid fa-star text-yellow-400 mr-1"></i> {product.rating}
                    </div>
                </div>
                <div className="p-4 flex flex-col flex-grow">
                    <h3 className="font-semibold text-gray-800 line-clamp-2 mb-1">{product.name}</h3>
                    <p className="text-agrivo-600 font-bold text-lg mb-2">{formatCurrency(product.price)} <span className="text-sm font-normal text-gray-500">/{product.unit}</span></p>
                    
                    <div className="mt-auto space-y-2">
                        <div className="flex items-center text-xs text-gray-500">
                            <i className="fa-solid fa-location-dot mr-1.5 w-3 text-center"></i>
                            <span className="truncate">{product.location}</span>
                        </div>
                        <div className="flex items-center text-xs text-gray-500">
                            <i className="fa-solid fa-box mr-1.5 w-3 text-center"></i>
                            Stok: {product.stock} {product.unit}
                        </div>
                        <div className="flex items-center text-xs text-gray-500">
                            <i className="fa-solid fa-shop mr-1.5 w-3 text-center"></i>
                            <span className="truncate">{product.sellerName}</span>
                        </div>
                    </div>
                </div>
            </div>
        );

        // ==========================================
        // 3. PAGES
        // ==========================================

        const HomePage = ({ navigate }) => {
            const categories = [
                { icon: '🌾', name: 'Padi & Beras' },
                { icon: '🌽', name: 'Jagung' },
                { icon: '🌶', name: 'Cabai' },
                { icon: '🥬', name: 'Sayuran' },
                { icon: '🍊', name: 'Buah' },
                { icon: '🌱', name: 'Benih' },
                { icon: '🧪', name: 'Pupuk' },
                { icon: '🚜', name: 'Alat Pertanian' }
            ];

            return (
                <div className="fade-in pb-20">
                    {/* Hero Section */}
                    <div className="bg-agrivo-900 text-white relative overflow-hidden">
                        <div className="absolute inset-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1595841696677-6489ff3f8cd1?auto=format&fit=crop&q=80&w=2000')] bg-cover bg-center"></div>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 lg:py-32 relative z-10 flex flex-col items-center text-center">
                            <Badge type="success"><span className="text-agrivo-100">DARI PETANI, UNTUK INDONESIA</span></Badge>
                            <h1 className="mt-6 text-4xl md:text-5xl lg:text-6xl font-bold tracking-tight max-w-4xl">
                                Temukan Produk dan Peluang Pertanian dalam <span className="text-agrivo-400">Satu Platform</span>.
                            </h1>
                            <p className="mt-6 text-lg md:text-xl text-gray-300 max-w-2xl">
                                AGRIVO menghubungkan petani, pembeli, supplier, dan pelaku usaha untuk membangun ekosistem pertanian Indonesia yang lebih terhubung.
                            </p>
                            
                            <div className="mt-10 w-full max-w-2xl bg-white p-2 rounded-2xl flex items-center shadow-xl">
                                <i className="fa-solid fa-search text-gray-400 ml-4 mr-3 text-lg"></i>
                                <input 
                                    type="text" 
                                    placeholder="Cari cabai, beras, pupuk, traktor..." 
                                    className="flex-grow py-3 px-2 outline-none text-gray-800 text-lg rounded-xl"
                                />
                                <Button className="px-6 py-3 text-lg rounded-xl hidden sm:block" onClick={() => navigate('/marketplace')}>Cari Produk</Button>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12">
                        {/* Categories */}
                        <div className="mb-16">
                            <h2 className="text-2xl font-bold text-gray-900 mb-6">Temukan Kebutuhan Pertanian</h2>
                            <div className="grid grid-cols-4 md:grid-cols-8 gap-4">
                                {categories.map(c => (
                                    <div key={c.name} onClick={() => navigate('/marketplace')} className="bg-white border border-gray-100 p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:shadow-md hover:border-agrivo-200 transition-all group">
                                        <div className="text-4xl mb-3 group-hover:scale-110 transition-transform">{c.icon}</div>
                                        <span className="text-sm font-medium text-center text-gray-700">{c.name}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Featured Products */}
                        <div className="mb-16">
                            <div className="flex justify-between items-end mb-6">
                                <div>
                                    <h2 className="text-2xl font-bold text-gray-900">Produk Pilihan Hari Ini</h2>
                                    <p className="text-gray-500 mt-1">Hasil panen terbaik langsung dari petani terverifikasi.</p>
                                </div>
                                <button onClick={() => navigate('/marketplace')} className="text-agrivo-600 font-semibold hover:text-agrivo-700 hidden sm:block">Lihat Semua <i className="fa-solid fa-arrow-right ml-1"></i></button>
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 sm:gap-6">
                                {MOCK_PRODUCTS.map(p => (
                                    <ProductCard key={p.id} product={p} onClick={() => navigate(`/product/${p.id}`)} />
                                ))}
                            </div>
                        </div>

                        {/* Trust Section */}
                        <div className="bg-agrivo-50 rounded-3xl p-8 md:p-12 flex flex-col md:flex-row items-center justify-between border border-agrivo-100">
                            <div className="md:w-1/2 mb-8 md:mb-0">
                                <h2 className="text-3xl font-bold text-gray-900 mb-4">Transaksi Aman & Terpercaya</h2>
                                <p className="text-gray-600 text-lg mb-6 leading-relaxed">
                                    Setiap penjual di AGRIVO melalui proses verifikasi ketat. Dana Anda aman bersama kami hingga pesanan selesai dan diterima dengan baik.
                                </p>
                                <ul className="space-y-3">
                                    <li className="flex items-center text-gray-700"><i className="fa-solid fa-check-circle text-agrivo-500 mr-3 text-xl"></i> Penjual Terverifikasi (KYC)</li>
                                    <li className="flex items-center text-gray-700"><i className="fa-solid fa-shield-halved text-agrivo-500 mr-3 text-xl"></i> Rekening Bersama Aman</li>
                                    <li className="flex items-center text-gray-700"><i className="fa-solid fa-headset text-agrivo-500 mr-3 text-xl"></i> Resolusi Konflik 24/7</li>
                                </ul>
                            </div>
                            <div className="md:w-5/12 grid grid-cols-2 gap-4">
                                <div className="bg-white p-6 rounded-2xl shadow-sm text-center">
                                    <h3 className="text-4xl font-bold text-agrivo-600 mb-2">10rb+</h3>
                                    <p className="text-gray-500 font-medium">Petani Bergabung</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm text-center">
                                    <h3 className="text-4xl font-bold text-agrivo-600 mb-2">50t+</h3>
                                    <p className="text-gray-500 font-medium">Transaksi Komoditas</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm text-center col-span-2">
                                    <h3 className="text-2xl font-bold text-gray-800 mb-2">⭐ 4.8 / 5.0</h3>
                                    <p className="text-gray-500 font-medium">Kepuasan Pengguna</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const MarketplacePage = ({ navigate }) => {
            const [products, setProducts] = useState([]);
            const [search, setSearch] = useState('');

            useEffect(() => {
                api.getProducts(search).then(setProducts);
            }, [search]);

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 fade-in pb-20">
                    <div className="mb-8">
                        <h1 className="text-3xl font-bold text-gray-900">Pasar Pertanian AGRIVO</h1>
                        <p className="text-gray-500 mt-2">Temukan hasil pertanian langsung dari petani dan pelaku usaha.</p>
                    </div>

                    <div className="flex flex-col md:flex-row gap-8">
                        {/* Sidebar Filter */}
                        <div className="w-full md:w-64 flex-shrink-0">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 sticky top-24">
                                <h3 className="font-bold text-gray-800 mb-4 pb-4 border-b">Filter Pencarian</h3>
                                
                                <div className="mb-6">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Kategori</label>
                                    <div className="space-y-2">
                                        {['Semua', 'Padi & Beras', 'Cabai', 'Sayuran', 'Pupuk'].map(cat => (
                                            <label key={cat} className="flex items-center">
                                                <input type="radio" name="cat" className="text-agrivo-600 focus:ring-agrivo-500 h-4 w-4" defaultChecked={cat==='Semua'} />
                                                <span className="ml-2 text-sm text-gray-600">{cat}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>

                                <div className="mb-6">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Lokasi (Provinsi)</label>
                                    <select className="w-full border-gray-300 rounded-lg shadow-sm focus:border-agrivo-500 focus:ring-agrivo-500 sm:text-sm p-2 border">
                                        <option>Semua Lokasi</option>
                                        <option>Jawa Timur</option>
                                        <option>Jawa Tengah</option>
                                        <option>Jawa Barat</option>
                                    </select>
                                </div>

                                <Button className="w-full">Terapkan Filter</Button>
                            </div>
                        </div>

                        {/* Product Grid */}
                        <div className="flex-grow">
                            <div className="bg-white p-2 rounded-xl shadow-sm border border-gray-200 mb-6 flex items-center">
                                <i className="fa-solid fa-search text-gray-400 ml-3"></i>
                                <input 
                                    type="text" 
                                    placeholder="Cari produk atau toko..." 
                                    className="w-full py-2 px-3 outline-none"
                                    value={search}
                                    onChange={(e) => setSearch(e.target.value)}
                                />
                            </div>

                            {products.length === 0 ? (
                                <div className="text-center py-20 bg-white rounded-2xl border border-gray-200">
                                    <i className="fa-solid fa-box-open text-6xl text-gray-300 mb-4"></i>
                                    <h3 className="text-xl font-medium text-gray-900">Belum ada produk yang sesuai.</h3>
                                    <p className="text-gray-500 mt-2">Coba gunakan kata kunci atau filter lain.</p>
                                    <Button className="mt-6" onClick={() => setSearch('')}>Reset Filter</Button>
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                                    {products.map(p => (
                                        <ProductCard key={p.id} product={p} onClick={() => navigate(`/product/${p.id}`)} />
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ProductDetailPage = ({ id, navigate, currentUser }) => {
            const [product, setProduct] = useState(null);
            const [qty, setQty] = useState(0);

            useEffect(() => {
                api.getProductById(id).then(data => {
                    setProduct(data);
                    if(data) setQty(data.minOrder);
                });
            }, [id]);

            if (!product) return <div className="p-20 text-center">Loading...</div>;

            const handleBuy = () => {
                if(!currentUser) return alert('Silakan login sebagai Buyer terlebih dahulu.');
                if(currentUser.role !== 'BUYER') return alert('Hanya akun Buyer yang dapat membuat pesanan.');
                navigate(`/checkout/${product.id}?qty=${qty}`);
            };

            return (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 fade-in pb-24 lg:pb-8">
                    <div className="text-sm text-gray-500 mb-6">
                        <span className="cursor-pointer hover:text-agrivo-600" onClick={() => navigate('/')}>Home</span> &gt; 
                        <span className="cursor-pointer hover:text-agrivo-600 ml-1" onClick={() => navigate('/marketplace')}>Marketplace</span> &gt; 
                        <span className="text-gray-800 font-medium ml-1">{product.name}</span>
                    </div>

                    <div className="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden flex flex-col lg:flex-row">
                        {/* Image Gallery */}
                        <div className="w-full lg:w-1/2 p-6 lg:border-r border-gray-200">
                            <div className="aspect-[4/3] rounded-2xl overflow-hidden bg-gray-100">
                                <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
                            </div>
                        </div>

                        {/* Product Info */}
                        <div className="w-full lg:w-1/2 p-6 lg:p-10 flex flex-col">
                            <div className="flex justify-between items-start mb-4">
                                <div>
                                    <Badge type="info">{product.category}</Badge>
                                    <h1 className="text-2xl lg:text-3xl font-bold text-gray-900 mt-3">{product.name}</h1>
                                </div>
                                <div className="flex items-center bg-yellow-50 px-3 py-1 rounded-lg border border-yellow-100">
                                    <i className="fa-solid fa-star text-yellow-400 mr-2 text-sm"></i>
                                    <span className="font-bold text-gray-800">{product.rating}</span>
                                </div>

                    <AddProductModal 
                        isOpen={showAddModal} 
                        onClose={() => setShowAddModal(false)}
                        onSave={(data) => {
                            if(!data.name) return alert('Nama produk wajib diisi.');
                            alert(`Produk "${data.name}" berhasil ditambahkan ke toko Anda! (Mode Simulasi)`);
                            setShowAddModal(false);
                        }} 
                    />
                </div>
            );
        };

        const AdminDashboard = () => (
            <div className="max-w-7xl mx-auto px-4 py-8 fade-in">
                <h1 className="text-3xl font-bold mb-8 text-gray-800">Admin Control Panel</h1>
                <div className="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl mb-6">
                    <h3 className="font-bold flex items-center"><i className="fa-solid fa-lock mr-2"></i> Akses Terbatas</h3>
                    <p className="text-sm mt-1">Ini adalah simulasi dashboard Admin AGRIVO. Anda memiliki hak akses penuh untuk verifikasi entitas dan memantau GMV.</p>
                </div>
                
                <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    {[{label: 'Total Users', val: '1,240', ic: 'users'}, {label: 'Active Sellers', val: '142', ic: 'shop'}, {label: 'Monthly GMV', val: 'Rp 4.2M', ic: 'chart-line'}, {label: 'AGRIVO Revenue', val: 'Rp 126K', ic: 'wallet'}].map(s => (
                        <div key={s.label} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <div className="flex justify-between items-start mb-4">
                                <div className="p-3 bg-gray-50 rounded-lg text-gray-500"><i className={`fa-solid fa-${s.ic}`}></i></div>
                                <span className="text-xs font-bold text-green-500">+12%</span>
                            </div>
                            <p className="text-gray-500 text-sm">{s.label}</p>
                            <h3 className="text-2xl font-bold">{s.val}</h3>
                        </div>
                    ))}
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div className="p-5 border-b border-gray-200 bg-gray-50">
                        <h3 className="font-bold text-gray-800">Pending Approvals (Verifikasi Bisnis)</h3>
                    </div>
                    <div className="p-8 text-center text-gray-500">
                        Tidak ada pengajuan bisnis baru.
                    </div>
                </div>
            </div>
        );

        // ==========================================
        // 3.5. AGRIBOT (AI ASSISTANT)
        // ==========================================
        const AgriBot = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [messages, setMessages] = useState([
                { role: 'model', text: 'Halo! Saya AgriBot 🤖, asisten pintar AGRIVO. Ada yang bisa saya bantu terkait produk pertanian, tips bertani, atau cara transaksi di platform ini?' }
            ]);
            const [input, setInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const chatEndRef = React.useRef(null);

            const scrollToBottom = () => chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            useEffect(() => { scrollToBottom(); }, [messages, isOpen]);

            const handleSend = async (e) => {
                e.preventDefault();
                if (!input.trim() || isTyping) return;

                const userMsg = input.trim();
                setInput('');
                
                const newHistory = [...messages, { role: 'user', text: userMsg }];
                setMessages(newHistory);
                setIsTyping(true);

                const sysInstruction = "Anda adalah AgriBot, asisten virtual dan AI resmi dari platform marketplace AGRIVO (Dari Petani Untuk Indonesia). Anda ramah, sangat cerdas, dan ahli dalam bidang pertanian Indonesia. Tugas Anda adalah membantu user mencari barang di AGRIVO, memberikan tips pertanian, info cuaca/musim tanam, dan panduan platform. Jawab dengan paragraf yang singkat, padat, dan format yang rapi. Gunakan emoji agar lebih interaktif.";
                
                const apiContents = newHistory.map(msg => ({
                    role: msg.role,
                    parts: [{ text: msg.text }]
                }));

                const response = await geminiApi.generateContent(apiContents, sysInstruction);
                
                setMessages(prev => [...prev, { role: 'model', text: response }]);
                setIsTyping(false);
            };

            return (
                <>
                    {/* Floating FAB */}
                    <button 
                        onClick={() => setIsOpen(!isOpen)}
                        className="fixed bottom-24 right-4 md:bottom-6 md:right-6 w-14 h-14 bg-agrivo-600 text-white rounded-full shadow-[0_8px_30px_rgb(0,0,0,0.3)] flex items-center justify-center hover:bg-agrivo-700 hover:scale-110 active:scale-95 transition-all z-[100]"
                        title="Tanya AgriBot AI"
                    >
                        <i className={`fa-solid ${isOpen ? 'fa-chevron-down' : 'fa-robot'} text-2xl`}></i>
                    </button>

                    {/* Chat Window */}
                    {isOpen && (
                        <div className="fixed bottom-40 right-4 md:bottom-24 md:right-6 w-80 sm:w-[380px] bg-white rounded-3xl shadow-[0_10px_50px_rgba(0,0,0,0.2)] border border-gray-100 z-[100] flex flex-col overflow-hidden fade-in origin-bottom-right transition-transform" style={{ height: '550px', maxHeight: '75vh' }}>
                            <div className="bg-gradient-to-r from-agrivo-700 to-agrivo-500 p-5 text-white flex items-center gap-4">
                                <div className="w-12 h-12 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center text-2xl shadow-inner border border-white/30">🤖</div>
                                <div>
                                    <h3 className="font-bold text-lg leading-tight">AgriBot AI</h3>
                                    <p className="text-xs text-agrivo-50 flex items-center mt-0.5"><span className="w-2 h-2 bg-green-400 rounded-full mr-1.5 animate-pulse"></span> Sedang Aktif</p>
                                </div>
                                <button onClick={() => setIsOpen(false)} className="ml-auto text-white/70 hover:text-white"><i className="fa-solid fa-xmark text-xl"></i></button>
                            </div>
                            
                            <div className="flex-1 p-5 overflow-y-auto bg-[#F8FAFC] flex flex-col gap-4">
                                <div className="text-center mb-2"><span className="bg-gray-200/60 text-gray-500 text-[10px] font-bold uppercase tracking-wider px-3 py-1 rounded-full">Hari Ini</span></div>
                                {messages.map((msg, i) => (
                                    <div key={i} className={`max-w-[85%] p-3.5 rounded-2xl text-[14px] leading-relaxed shadow-sm ${msg.role === 'user' ? 'bg-agrivo-100 text-agrivo-900 self-end rounded-tr-sm' : 'bg-white text-gray-700 self-start rounded-tl-sm border border-gray-100'}`}>
                                        <div dangerouslySetInnerHTML={{__html: msg.text.replace(/\n/g, '<br/>')}}></div>
                                    </div>
                                ))}
                                {isTyping && (
                                    <div className="bg-white text-gray-500 self-start px-4 py-3.5 rounded-2xl rounded-tl-sm border border-gray-100 shadow-sm text-sm flex items-center gap-1.5">
                                        <span className="w-2 h-2 bg-agrivo-400 rounded-full animate-bounce"></span>
                                        <span className="w-2 h-2 bg-agrivo-400 rounded-full animate-bounce" style={{animationDelay: '0.15s'}}></span>
                                        <span className="w-2 h-2 bg-agrivo-400 rounded-full animate-bounce" style={{animationDelay: '0.3s'}}></span>
                                    </div>
                                )}
                                <div ref={chatEndRef} />
                            </div>

                            <form onSubmit={handleSend} className="p-3 bg-white border-t border-gray-100 flex gap-2">
                                <input 
                                    type="text" 
                                    value={input}
                                    onChange={e => setInput(e.target.value)}
                                    placeholder="Tanya seputar pertanian..." 
                                    className="flex-1 bg-gray-50 border border-gray-200 rounded-full px-5 py-3 text-sm outline-none focus:ring-2 focus:ring-agrivo-500/50 focus:bg-white transition-all"
                                />
                                <button type="submit" disabled={!input.trim() || isTyping} className="w-12 h-12 bg-agrivo-600 text-white rounded-full flex items-center justify-center hover:bg-agrivo-700 hover:shadow-md disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:shadow-none transition-all flex-shrink-0">
                                    <i className="fa-solid fa-paper-plane text-sm ml-0.5"></i>
                                </button>
                            </form>
                        </div>
                    )}
                </>
            );
        };

        // ==========================================
        // 4. MAIN LAYOUT & ROUTING (App Component)
        // ==========================================

        const App = () => {
            const [route, setRoute] = useState('/');
            const [currentUser, setCurrentUser] = useState(null); // default not logged in
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            // Simple client-side router
            const navigate = (path) => {
                setRoute(path);
                window.scrollTo(0,0);
                setMobileMenuOpen(false);
            };

            const renderPage = () => {
                if (route === '/') return <HomePage navigate={navigate} />;
                if (route === '/marketplace') return <MarketplacePage navigate={navigate} />;
                if (route.startsWith('/product/')) return <ProductDetailPage id={route.split('/')[2]} navigate={navigate} currentUser={currentUser} />;
                if (route.startsWith('/checkout/')) {
                    const params = new URLSearchParams(route.split('?')[1]);
                    return <CheckoutPage id={route.split('/')[2].split('?')[0]} qty={params.get('qty') || 1} navigate={navigate} currentUser={currentUser} />;
                }
                if (route === '/chat') return <ChatPage navigate={navigate} currentUser={currentUser} />;
                
                // Protected Routes
                if (route === '/buyer/orders' && currentUser?.role === 'BUYER') return <BuyerDashboard currentUser={currentUser} />;
                if (route === '/seller/dashboard' && currentUser?.role === 'SELLER') return <SellerDashboard currentUser={currentUser} />;
                if (route === '/admin' && currentUser?.role === 'ADMIN') return <AdminDashboard />;
                
                return <div className="p-20 text-center"><h1 className="text-2xl font-bold">404 - Halaman tidak ditemukan atau akses ditolak.</h1><Button className="mt-4" onClick={()=>navigate('/')}>Kembali ke Beranda</Button></div>;
            };

            // Mock Authentication Switcher (For Demo Purposes)
            const AuthSwitcher = () => (
                <div className="fixed bottom-4 right-4 z-50 bg-white p-3 rounded-xl shadow-2xl border border-gray-200 hidden md:block">
                    <p className="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2 text-center">Simulasi Login Mode</p>
                    <div className="flex gap-2">
                        <button onClick={() => { setCurrentUser(null); navigate('/'); }} className={`px-3 py-1.5 text-xs rounded font-medium ${!currentUser ? 'bg-gray-800 text-white' : 'bg-gray-100 hover:bg-gray-200'}`}>Guest</button>
                        <button onClick={() => { setCurrentUser(MOCK_USERS.buyer); navigate('/'); }} className={`px-3 py-1.5 text-xs rounded font-medium ${currentUser?.role === 'BUYER' ? 'bg-blue-600 text-white' : 'bg-gray-100 hover:bg-gray-200'}`}>Buyer</button>
                        <button onClick={() => { setCurrentUser(MOCK_USERS.seller); navigate('/seller/dashboard'); }} className={`px-3 py-1.5 text-xs rounded font-medium ${currentUser?.role === 'SELLER' ? 'bg-agrivo-600 text-white' : 'bg-gray-100 hover:bg-gray-200'}`}>Seller</button>
                        <button onClick={() => { setCurrentUser(MOCK_USERS.admin); navigate('/admin'); }} className={`px-3 py-1.5 text-xs rounded font-medium ${currentUser?.role === 'ADMIN' ? 'bg-red-600 text-white' : 'bg-gray-100 hover:bg-gray-200'}`}>Admin</button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col relative">
                    {/* Top Navbar */}
                    <nav className="bg-white border-b border-gray-200 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16">
                                <div className="flex items-center">
                                    <div className="flex-shrink-0 flex items-center cursor-pointer" onClick={() => navigate('/')}>
                                        <i className="fa-solid fa-leaf text-agrivo-600 text-2xl mr-2"></i>
                                        <span className="font-bold text-2xl tracking-tight text-gray-900">AGRIVO</span>
                                    </div>
                                    <div className="hidden md:ml-10 md:flex md:space-x-8">
                                        <a onClick={() => navigate('/')} className={`cursor-pointer inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium ${route==='/' ? 'border-agrivo-500 text-gray-900' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}>Beranda</a>
                                        <a onClick={() => navigate('/marketplace')} className={`cursor-pointer inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium ${route==='/marketplace' ? 'border-agrivo-500 text-gray-900' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}`}>Pasar Pertanian</a>
                                        <a className="cursor-pointer inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300">Kebutuhan Pertanian</a>
                                    </div>
                                </div>
                                <div className="hidden md:flex items-center space-x-6">
                                    <i className="fa-solid fa-search text-gray-500 hover:text-agrivo-600 cursor-pointer" onClick={() => navigate('/marketplace')}></i>
                                    {currentUser ? (
                                        <>
                                            <i className="fa-regular fa-comment-dots text-gray-500 hover:text-agrivo-600 cursor-pointer text-lg relative" onClick={() => navigate('/chat')}>
                                                <span className="absolute -top-1 -right-1 flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>
                                            </i>
                                            <i className="fa-regular fa-bell text-gray-500 hover:text-agrivo-600 cursor-pointer text-lg"></i>
                                            <div className="flex items-center gap-2 cursor-pointer bg-gray-50 px-3 py-1.5 rounded-full border border-gray-200"
                                                 onClick={() => {
                                                     if(currentUser.role === 'BUYER') navigate('/buyer/orders');
                                                     if(currentUser.role === 'SELLER') navigate('/seller/dashboard');
                                                     if(currentUser.role === 'ADMIN') navigate('/admin');
                                                 }}>
                                                <img src={currentUser.avatar} className="w-6 h-6 rounded-full" />
                                                <span className="text-sm font-medium">{currentUser.name}</span>
                                            </div>
                                        </>
                                    ) : (
                                        <div className="flex items-center space-x-4">
                                            <button className="text-gray-600 font-medium hover:text-agrivo-600 text-sm" onClick={() => setCurrentUser(MOCK_USERS.buyer)}>Masuk</button>
                                            <Button size="sm" className="text-sm py-2 px-4" onClick={() => setCurrentUser(MOCK_USERS.buyer)}>Daftar</Button>
                                        </div>
                                    )}
                                </div>
                                <div className="flex items-center md:hidden">
                                    <button className="text-gray-500 hover:text-gray-700 focus:outline-none" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                                        <i className={`fa-solid ${mobileMenuOpen ? 'fa-xmark' : 'fa-bars'} text-2xl`}></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <main className="flex-grow w-full">
                        {renderPage()}
                    </main>

                    {/* Desktop Footer */}
                    <footer className="bg-white border-t border-gray-200 hidden lg:block mt-auto">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                            <div className="grid grid-cols-4 gap-8">
                                <div className="col-span-1">
                                    <div className="flex items-center mb-4">
                                        <i className="fa-solid fa-leaf text-agrivo-600 text-2xl mr-2"></i>
                                        <span className="font-bold text-2xl text-gray-900">AGRIVO</span>
                                    </div>
                                    <p className="text-sm text-gray-500 mb-4">Platform Digital untuk Ekosistem Pertanian Indonesia. Dari Petani, Untuk Indonesia.</p>
                                    <div className="flex space-x-4 text-gray-400">
                                        <i className="fa-brands fa-instagram hover:text-agrivo-600 cursor-pointer"></i>
                                        <i className="fa-brands fa-facebook hover:text-agrivo-600 cursor-pointer"></i>
                                        <i className="fa-brands fa-linkedin hover:text-agrivo-600 cursor-pointer"></i>
                                    </div>
                                </div>
                                <div>
                                    <h4 className="font-bold text-gray-900 mb-4">Layanan</h4>
                                    <ul className="space-y-2 text-sm text-gray-500">
                                        <li className="hover:text-agrivo-600 cursor-pointer" onClick={() => navigate('/marketplace')}>Pasar Pertanian</li>
                                        <li className="hover:text-agrivo-600 cursor-pointer">Kebutuhan Pertanian</li>
                                        <li className="hover:text-agrivo-600 cursor-pointer">AGRIVO Jobs</li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-bold text-gray-900 mb-4">Bantuan</h4>
                                    <ul className="space-y-2 text-sm text-gray-500">
                                        <li className="hover:text-agrivo-600 cursor-pointer">Cara Belanja</li>
                                        <li className="hover:text-agrivo-600 cursor-pointer">Mulai Berjualan</li>
                                        <li className="hover:text-agrivo-600 cursor-pointer">Hubungi Kami</li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-bold text-gray-900 mb-4">Keamanan</h4>
                                    <div className="flex items-center gap-2 mb-2">
                                        <i className="fa-solid fa-shield-check text-agrivo-500"></i>
                                        <span className="text-sm text-gray-500">Pembayaran Aman</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <i className="fa-solid fa-user-check text-agrivo-500"></i>
                                        <span className="text-sm text-gray-500">Pengguna Terverifikasi</span>
                                    </div>
                                </div>
                            </div>
                            <div className="border-t border-gray-100 mt-12 pt-8 text-center text-sm text-gray-400">
                                &copy; 2026 AGRIVO. All rights reserved.
                            </div>
                        </div>
                    </footer>

                    {/* Mobile Bottom Navigation (Mobile-First approach) */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center h-16 z-50 pb-[env(safe-area-inset-bottom)]">
                        <button onClick={() => navigate('/')} className={`flex flex-col items-center justify-center w-full h-full ${route==='/' ? 'text-agrivo-600' : 'text-gray-400'}`}>
                            <i className="fa-solid fa-house text-xl mb-1"></i>
                            <span className="text-[10px] font-medium">Home</span>
                        </button>
                        <button onClick={() => navigate('/marketplace')} className={`flex flex-col items-center justify-center w-full h-full ${route==='/marketplace' ? 'text-agrivo-600' : 'text-gray-400'}`}>
                            <i className="fa-solid fa-store text-xl mb-1"></i>
                            <span className="text-[10px] font-medium">Pasar</span>
                        </button>
                        {currentUser?.role === 'BUYER' && (
                            <button onClick={() => navigate('/buyer/orders')} className={`flex flex-col items-center justify-center w-full h-full ${route==='/buyer/orders' ? 'text-agrivo-600' : 'text-gray-400'}`}>
                                <i className="fa-solid fa-receipt text-xl mb-1"></i>
                                <span className="text-[10px] font-medium">Pesanan</span>
                            </button>
                        )}
                        {currentUser?.role === 'SELLER' && (
                            <button onClick={() => navigate('/seller/dashboard')} className={`flex flex-col items-center justify-center w-full h-full ${route==='/seller/dashboard' ? 'text-agrivo-600' : 'text-gray-400'}`}>
                                <i className="fa-solid fa-chart-line text-xl mb-1"></i>
                                <span className="text-[10px] font-medium">Toko</span>
                            </button>
                        )}
                        <button onClick={() => navigate('/chat')} className={`flex flex-col items-center justify-center w-full h-full ${route==='/chat' ? 'text-agrivo-600' : 'text-gray-400'} relative`}>
                            <i className="fa-regular fa-comment-dots text-xl mb-1"></i>
                            <span className="absolute top-2 right-4 w-2 h-2 bg-red-500 rounded-full"></span>
                            <span className="text-[10px] font-medium">Chat</span>
                        </button>
                        <button onClick={() => {
                            if(!currentUser) setCurrentUser(MOCK_USERS.buyer);
                            else { setCurrentUser(null); navigate('/'); }
                        }} className="flex flex-col items-center justify-center w-full h-full text-gray-400">
                            <i className="fa-regular fa-user text-xl mb-1"></i>
                            <span className="text-[10px] font-medium">{currentUser ? 'Keluar' : 'Profil'}</span>
                        </button>
                    </div>

                    <AuthSwitcher />
                    <AgriBot />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
