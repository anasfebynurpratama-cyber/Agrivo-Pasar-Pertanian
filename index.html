<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRIVO - Dari Petani, Untuk Indonesia</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        agrivo: {
                            50: '#fdf2f2',
                            100: '#fbe5e5',
                            200: '#f5caca',
                            300: '#efa2a2',
                            400: '#e56c6c',
                            500: '#db3e3e',
                            600: '#c52020', // Merah Dominan Logo AGRIVO
                            700: '#a51818',
                            800: '#881717',
                            900: '#721919',
                        },
                        agrivoGreen: {
                            500: '#2b7a1f', // Hijau Daun/Pertanian Logo
                        },
                        agrivoBlue: {
                            500: '#0070c0', // Biru Air/Perikanan Logo
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- React Router DOM v6 & Dependencies -->
    <script crossorigin src="https://unpkg.com/@remix-run/router@1.15.3/dist/router.umd.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-router@6.22.3/dist/umd/react-router.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-router-dom@6.22.3/dist/umd/react-router-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
        const { HashRouter, Routes, Route, Navigate, useNavigate, useParams, useLocation } = window.ReactRouterDOM;

        // ==========================================
        // 1. MOCK DATA LAYER (Simulating PostgreSQL/Laravel API)
        // ==========================================
        
        let MOCK_USERS_DB = [
            { id: 'u1', name: 'Ahmad Pembeli', role: 'BUYER', email: 'buyer@agrivo.com', phone: '081234567890', password: 'Password123', avatar: 'https://i.pravatar.cc/150?u=u1', provinceId: '35', cityId: '3515', districtId: '351501', fullAddress: 'Jl. Letjen Suprapto No 14, Waru' },
            { id: 'u2', name: 'Pak Budi Farm', role: 'SELLER', email: 'seller@agrivo.com', phone: '081234567891', password: 'Password123', avatar: 'https://images.unsplash.com/photo-1595841696677-6489ff3f8cd1?auto=format&fit=crop&q=80&w=200', verified: true, location: 'Sidoarjo, Jawa Timur', businessType: 'Petani', provinceId: '35', cityId: '3515', fullAddress: 'Desa Tani Jaya Blok B, Sidoarjo' },
            { id: 'u3', name: 'Admin AGRIVO', role: 'ADMIN', email: 'admin@agrivo.com', phone: '081234567892', password: 'Password123', avatar: 'https://ui-avatars.com/api/?name=Admin&background=c52020&color=fff' },
            { id: 'u4', name: 'Sumber Rejeki', role: 'SELLER', email: 'seller2@agrivo.com', phone: '081234567893', password: 'Password123', avatar: 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&q=80&w=200', verified: true, location: 'Jember, Jawa Timur', businessType: 'Distributor' },
            { id: 'u5', name: 'Agro Sejahtera', role: 'SELLER', email: 'seller3@agrivo.com', phone: '081234567894', password: 'Password123', avatar: 'https://images.unsplash.com/photo-1564410267841-915d8e4d71ea?auto=format&fit=crop&q=80&w=200', verified: false, location: 'Malang, Jawa Timur', businessType: 'Petani' },
            { id: 'u6', name: 'Mitra Tani Jaya', role: 'SELLER', email: 'seller4@agrivo.com', phone: '081234567895', password: 'Password123', avatar: 'https://images.unsplash.com/photo-1589923188900-85dae523342b?auto=format&fit=crop&q=80&w=200', verified: true, location: 'Surabaya, Jawa Timur', businessType: 'Supplier' },
            { id: 'u7', name: 'Toko Tani Berkah', role: 'SELLER', email: 'seller5@agrivo.com', phone: '081234567896', password: 'Password123', avatar: 'https://ui-avatars.com/api/?name=Toko+Tani&background=0070c0&color=fff', verified: false, location: 'Bandung, Jawa Barat', businessType: 'UMKM' }
        ];

        let MOCK_PRODUCTS = [
            { id: 'p1', sellerId: 'u2', sellerName: 'Pak Budi Farm', name: 'Cabai Merah Besar Premium', category: 'Cabai', price: 28000, unit: 'kg', stock: 500, minOrder: 10, location: 'Sidoarjo, Jawa Timur', rating: 4.9, image: 'https://images.unsplash.com/photo-1588880196853-53372c019d9b?auto=format&fit=crop&q=80&w=800', description: 'Cabai merah besar segar langsung dari kebun. Cocok untuk industri makanan dan restoran. Dipanen setiap pagi.', status: 'APPROVED' },
            { id: 'p2', sellerId: 'u2', sellerName: 'Pak Budi Farm', name: 'Jagung Pipilan Kering', category: 'Jagung', price: 6500, unit: 'kg', stock: 2000, minOrder: 50, location: 'Sidoarjo, Jawa Timur', rating: 4.8, image: 'https://images.unsplash.com/photo-1601648764658-cf37e8c89b70?auto=format&fit=crop&q=80&w=800', description: 'Jagung pipilan kering kadar air 15%. Cocok untuk pakan ternak.', status: 'APPROVED' },
            { id: 'p3', sellerId: 'u4', sellerName: 'Sumber Rejeki', name: 'Beras Premium Mentik Wangi', category: 'Padi & Beras', price: 15000, unit: 'kg', stock: 1000, minOrder: 25, location: 'Jember, Jawa Timur', rating: 5.0, image: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&q=80&w=800', description: 'Beras premium tanpa pemutih dan pewangi buatan. Pulen dan wangi alami.', status: 'APPROVED' },
            { id: 'p4', sellerId: 'u5', sellerName: 'Agro Sejahtera', name: 'Tomat Segar Grade A', category: 'Sayuran', price: 12000, unit: 'kg', stock: 800, minOrder: 20, location: 'Malang, Jawa Timur', rating: 4.7, image: 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?auto=format&fit=crop&q=80&w=800', description: 'Tomat segar pilihan dari dataran tinggi Malang.', status: 'APPROVED' },
            { id: 'p5', sellerId: 'u6', sellerName: 'Mitra Tani Jaya', name: 'Pupuk NPK Mutiara', category: 'Pupuk', price: 350000, unit: 'sak', stock: 100, minOrder: 1, location: 'Surabaya, Jawa Timur', rating: 4.9, image: 'https://images.unsplash.com/photo-1628543105315-9988b49e1a38?auto=format&fit=crop&q=80&w=800', description: 'Pupuk NPK lengkap untuk masa vegetatif dan generatif.', status: 'APPROVED' },
        ];

        let MOCK_ORDERS = [
            { id: 'AGR-2026-000003', buyerId: 'u1', sellerId: 'u2', productId: 'p1', productName: 'Cabai Merah Besar Premium', qty: 20, price: 28000, subtotal: 560000, fee: 10000, total: 570000, status: 'DELIVERED', date: '2026-09-12', isReviewed: false },
            { id: 'AGR-2026-000001', buyerId: 'u1', sellerId: 'u2', productId: 'p2', productName: 'Jagung Pipilan Kering', qty: 50, price: 6500, subtotal: 325000, fee: 10000, total: 335000, status: 'PROCESSING', date: '2026-09-10', isReviewed: false },
            { id: 'AGR-2026-000002', buyerId: 'u1', sellerId: 'u4', productId: 'p3', productName: 'Beras Premium Mentik Wangi', qty: 100, price: 15000, subtotal: 1500000, fee: 15000, total: 1515000, status: 'COMPLETED', date: '2026-09-01', isReviewed: true }
        ];

        let MOCK_REVIEWS = [
            { id: 'r1', productId: 'p3', reviewerName: 'Ahmad Pembeli', rating: 5, comment: 'Berasnya sangat pulen dan wanginya alami. Pengiriman juga sangat cepat sampai ke Sidoarjo. Mantap!', date: '2026-09-02', avatar: 'https://i.pravatar.cc/150?u=u1' },
            { id: 'r2', productId: 'p1', reviewerName: 'Budi Santoso', rating: 4, comment: 'Cabainya segar dan ukurannya rata-rata besar. Hanya saja pengemasan kardus sedikit penyok di jalan.', date: '2026-08-25', avatar: 'https://i.pravatar.cc/150?u=u9' }
        ];

        let MOCK_CHATS = [
            { id: 'c1', orderId: null, buyerId: 'u1', sellerId: 'u2', messages: [
                { senderId: 'u1', text: 'Pak, kalau ambil 500 kg harganya bisa kurang?', time: '10:00' },
                { senderId: 'u2', text: 'Bisa mas, kalau 500 kg saya kasih Rp26.000/kg.', time: '10:05' }
            ]}
        ];

        let MOCK_CART = []; 

        const MOCK_LOCATIONS = {
            provinces: [ { id: '35', name: 'Jawa Timur' }, { id: '33', name: 'Jawa Tengah' }, { id: '32', name: 'Jawa Barat' } ],
            cities: { '35': [{ id: '3515', name: 'Kab. Sidoarjo' }, { id: '3578', name: 'Kota Surabaya' }, { id: '3573', name: 'Kota Malang' }, { id: '3509', name: 'Kab. Jember' }], '33': [{ id: '3374', name: 'Kota Semarang' }], '32': [{ id: '3273', name: 'Kota Bandung' }] },
            districts: { '3515': [{ id: '351501', name: 'Waru' }, { id: '351502', name: 'Taman' }, { id: '351503', name: 'Sidoarjo' }] }
        };

        // ==========================================
        // 1.5. GEMINI AI INTEGRATION
        // ==========================================
        const geminiApi = {
            generateContent: async (contents, systemInstruction) => {
                const apiKey = ""; // Canvas runtime injects key here
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                const payload = { contents };
                if (systemInstruction) {
                    payload.systemInstruction = { parts: [{ text: systemInstruction }] };
                }

                try {
                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const result = await response.json();
                    return result?.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf, terjadi kesalahan pemrosesan AI.";
                } catch (error) {
                    console.error("Gemini Error:", error);
                    return "Gagal terhubung ke layanan AI AGRIVO.";
                }
            }
        };

        // API Service Simulation
        const api = {
            getProducts: async (search = '', category = 'Semua', location = 'Semua Lokasi') => {
                return MOCK_PRODUCTS.filter(p => 
                    (p.name.toLowerCase().includes(search.toLowerCase()) || p.category.toLowerCase().includes(search.toLowerCase())) &&
                    (category !== 'Semua' ? p.category === category : true) &&
                    (location !== 'Semua Lokasi' ? p.location.includes(location) : true)
                );
            },
            getProductById: async (id) => MOCK_PRODUCTS.find(p => p.id === id),
            getProductsBySeller: async (sellerId, excludeId) => MOCK_PRODUCTS.filter(p => p.sellerId === sellerId && p.id !== excludeId),
            getUserById: async (id) => MOCK_USERS_DB.find(u => u.id === id),
            
            // Businesses API
            getBusinesses: async (search = '', businessType = 'Semua', location = 'Semua Lokasi') => {
                return MOCK_USERS_DB.filter(u => 
                    u.role === 'SELLER' &&
                    (u.name.toLowerCase().includes(search.toLowerCase()) || u.businessType?.toLowerCase().includes(search.toLowerCase())) &&
                    (businessType !== 'Semua' ? u.businessType === businessType : true) &&
                    (location !== 'Semua Lokasi' ? (u.location && u.location.includes(location)) : true)
                );
            },
            
            // Profile & Settings API
            updateProfile: async (userId, data) => {
                await new Promise(resolve => setTimeout(resolve, 800)); // simulate network delay
                const index = MOCK_USERS_DB.findIndex(u => u.id === userId);
                if(index !== -1) {
                    // Update user in mock database
                    MOCK_USERS_DB[index] = { ...MOCK_USERS_DB[index], ...data };
                    // If address is updated, update the general 'location' string based on province/city mapping
                    if(data.provinceId && data.cityId) {
                        const prov = MOCK_LOCATIONS.provinces.find(p => p.id === data.provinceId)?.name || '';
                        const city = MOCK_LOCATIONS.cities[data.provinceId]?.find(c => c.id === data.cityId)?.name || '';
                        MOCK_USERS_DB[index].location = `${city.replace('Kab. ', '').replace('Kota ', '')}, ${prov}`;
                    }
                    return { success: true, data: MOCK_USERS_DB[index], message: 'Profil berhasil diperbarui.' };
                }
                return { success: false, message: 'Pengguna tidak ditemukan.' };
            },
            updatePassword: async (userId, oldPass, newPass) => {
                await new Promise(resolve => setTimeout(resolve, 800));
                const user = MOCK_USERS_DB.find(u => u.id === userId);
                if(user.password !== oldPass) return { success: false, message: 'Password lama salah.' };
                user.password = newPass;
                return { success: true, message: 'Password berhasil diubah.' };
            },

            // Produk - CRUD
            addProduct: async (data) => {
                const newProduct = { id: 'p' + Date.now(), ...data, rating: 0, status: 'APPROVED' };
                MOCK_PRODUCTS.unshift(newProduct);
                return newProduct;
            },
            updateProduct: async (productId, data) => {
                const index = MOCK_PRODUCTS.findIndex(p => p.id === productId);
                if (index !== -1) MOCK_PRODUCTS[index] = { ...MOCK_PRODUCTS[index], ...data };
                return MOCK_PRODUCTS[index];
            },
            deleteProduct: async (productId) => {
                MOCK_PRODUCTS = MOCK_PRODUCTS.filter(p => p.id !== productId);
                return { success: true };
            },

            // Keranjang & Order
            addToCart: async (userId, product, qty) => {
                MOCK_CART.push({ id: 'cart_' + Date.now(), userId, product, qty });
                window.dispatchEvent(new Event('cartUpdated'));
                return { success: true };
            },
            getCartByUser: async (userId) => MOCK_CART.filter(c => c.userId === userId),
            removeFromCart: async (cartId) => {
                MOCK_CART = MOCK_CART.filter(c => c.id !== cartId);
                window.dispatchEvent(new Event('cartUpdated'));
                return { success: true };
            },
            createOrder: async (orderData) => {
                const newOrder = { id: `AGR-2026-${String(MOCK_ORDERS.length + 1).padStart(6, '0')}`, ...orderData, status: 'PENDING', date: new Date().toISOString().split('T')[0], isReviewed: false };
                MOCK_ORDERS.unshift(newOrder);
                return newOrder;
            },
            getOrdersByUser: async (userId, role) => MOCK_ORDERS.filter(o => role === 'BUYER' ? o.buyerId === userId : o.sellerId === userId),
            updateOrderStatus: async (orderId, newStatus) => {
                const order = MOCK_ORDERS.find(o => o.id === orderId);
                if(order) order.status = newStatus;
                return order;
            },
            markOrderAsReviewed: async (orderId) => {
                const order = MOCK_ORDERS.find(o => o.id === orderId);
                if(order) order.isReviewed = true;
                return order;
            },

            // Ulasan
            addReview: async (reviewData) => {
                const newReview = { id: 'r' + Date.now(), date: new Date().toISOString().split('T')[0], ...reviewData };
                MOCK_REVIEWS.unshift(newReview);
                return newReview;
            },
            getReviewsByProduct: async (productId) => MOCK_REVIEWS.filter(r => r.productId === productId),
            
            // Auth
            login: async (email, password) => {
                await new Promise(resolve => setTimeout(resolve, 800));
                const user = MOCK_USERS_DB.find(u => u.email === email);
                if (!user) return { success: false, message: 'Email tidak ditemukan.' };
                if (user.password !== password) return { success: false, message: 'Password salah.' };
                return { success: true, message: 'Login berhasil', data: user };
            },
            register: async (payload) => {
                await new Promise(resolve => setTimeout(resolve, 1500));
                if (MOCK_USERS_DB.some(u => u.email === payload.email)) return { success: false, message: 'Email sudah terdaftar.' };
                const newUser = { id: 'u' + Date.now(), ...payload, avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(payload.name)}&background=c52020&color=fff`, status: 'PENDING_VERIFICATION' };
                MOCK_USERS_DB.push(newUser);
                return { success: true, message: 'Registrasi berhasil', data: { userId: newUser.id, phone: payload.phone } };
            },
            verifyOTP: async (userId, otp) => {
                await new Promise(resolve => setTimeout(resolve, 1000));
                if (otp === '123456') return { success: true, message: 'Akun berhasil diverifikasi.' };
                return { success: false, message: 'Kode OTP tidak valid.' };
            }
        };

        // ==========================================
        // 2. REUSABLE UI COMPONENTS
        // ==========================================

        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        };

        const Badge = ({ children, type = 'default', className = '' }) => {
            const colors = {
                success: 'bg-green-100 text-green-800 border-green-200',
                warning: 'bg-yellow-100 text-yellow-800 border-yellow-200',
                danger: 'bg-red-100 text-red-800 border-red-200',
                info: 'bg-blue-100 text-blue-800 border-blue-200',
                default: 'bg-gray-100 text-gray-800 border-gray-200'
            };
            return <span className={`px-2.5 py-1 text-xs font-semibold rounded-full border ${colors[type]} ${className}`}>{children}</span>;
        };

        const Button = ({ children, variant = 'primary', className = '', onClick, disabled, size = 'md', type = 'button' }) => {
            const sizeStyle = size === 'sm' ? 'px-3 py-1.5 text-sm' : size === 'lg' ? 'px-6 py-3.5 text-lg' : 'px-4 py-2.5';
            const baseStyle = "inline-flex items-center justify-center font-semibold rounded-xl transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-agrivo-600 hover:bg-agrivo-700 text-white focus:ring-agrivo-500 hover:shadow-md hover:-translate-y-0.5",
                secondary: "bg-agrivo-50 hover:bg-agrivo-100 text-agrivo-700 focus:ring-agrivo-500",
                outline: "border-2 border-gray-200 bg-white hover:bg-gray-50 hover:border-gray-300 text-gray-700 focus:ring-gray-500",
                danger: "bg-red-50 hover:bg-red-600 hover:text-white text-red-600 border border-red-100 focus:ring-red-500"
            };
            return (
                <button type={type} disabled={disabled} onClick={onClick} className={`${baseStyle} ${variants[variant]} ${sizeStyle} ${className}`}>
                    {children}
                </button>
            );
        };

        const InputGroup = ({ label, type = 'text', value, onChange, placeholder, icon, required, error, disabled, min }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-semibold text-gray-700 mb-1.5">{label} {required && <span className="text-red-500">*</span>}</label>}
                <div className="relative">
                    {icon && <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"><i className={`fa-solid ${icon}`}></i></div>}
                    <input 
                        type={type} value={value} onChange={onChange} placeholder={placeholder} disabled={disabled} min={min}
                        onKeyDown={(e) => { if (type === 'number' && e.key === '-') e.preventDefault(); }}
                        className={`w-full border ${error ? 'border-red-500 focus:ring-red-500' : 'border-gray-300 focus:ring-agrivo-600'} rounded-xl py-3 ${icon ? 'pl-10' : 'pl-4'} pr-4 outline-none focus:ring-2 focus:border-transparent transition-all disabled:bg-gray-50 text-sm`}
                    />
                </div>
                {error && <p className="mt-1 text-xs text-red-500">{error}</p>}
            </div>
        );

        const PasswordInput = ({ label, value, onChange, placeholder, required, error }) => {
            const [show, setShow] = useState(false);
            return (
                <div className="mb-4">
                    {label && <label className="block text-sm font-semibold text-gray-700 mb-1.5">{label} {required && <span className="text-red-500">*</span>}</label>}
                    <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"><i className="fa-solid fa-lock"></i></div>
                        <input type={show ? 'text' : 'password'} value={value} onChange={onChange} placeholder={placeholder} className={`w-full border ${error ? 'border-red-500' : 'border-gray-300 focus:ring-agrivo-600'} rounded-xl py-3 pl-10 pr-12 outline-none focus:ring-2 transition-all text-sm`} />
                        <button type="button" onClick={() => setShow(!show)} className="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600"><i className={`fa-regular ${show ? 'fa-eye-slash' : 'fa-eye'}`}></i></button>
                    </div>
                    {error && <p className="mt-1 text-xs text-red-500">{error}</p>}
                </div>
            );
        };

        const SelectGroup = ({ label, value, onChange, options, placeholder, required, error, disabled }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-semibold text-gray-700 mb-1.5">{label} {required && <span className="text-red-500">*</span>}</label>}
                <select value={value} onChange={onChange} disabled={disabled} className={`w-full border ${error ? 'border-red-500' : 'border-gray-300 focus:ring-agrivo-600'} rounded-xl py-3 px-4 outline-none focus:ring-2 transition-all text-sm bg-white cursor-pointer disabled:bg-gray-50`}>
                    <option value="" disabled>{placeholder}</option>
                    {options.map(opt => <option key={opt.id} value={opt.id}>{opt.name}</option>)}
                </select>
                {error && <p className="mt-1 text-xs text-red-500">{error}</p>}
            </div>
        );

        const ProductCard = ({ product, onClick }) => (
            <div onClick={onClick} className="bg-white rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.04)] border border-gray-100 overflow-hidden hover:shadow-xl hover:border-agrivo-200 transition-all cursor-pointer flex flex-col h-full group">
                <div className="relative h-48 overflow-hidden bg-gray-100">
                    <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                    <div className="absolute top-2 right-2 bg-white/90 backdrop-blur-md px-2.5 py-1 rounded-lg text-xs font-bold text-gray-800 flex items-center shadow-sm">
                        <i className="fa-solid fa-star text-yellow-400 mr-1.5"></i> {product.rating}
                    </div>
                </div>
                <div className="p-4 flex flex-col flex-grow">

            const [orders, setOrders] = useState([]);
            const [sellerProducts, setSellerProducts] = useState([]);
            const [activeTab, setActiveTab] = useState('products'); 
            const [showAddModal, setShowAddModal] = useState(false);
            const [editProduct, setEditProduct] = useState(null);

            const loadData = () => {
                api.getOrdersByUser(currentUser.id, 'SELLER').then(setOrders);

                if(!data.name || !data.price || !data.stock) return showToast('Harap lengkapi Nama, Harga, dan Stok.', 'error');
                
                if (editProduct) {
                    await api.updateProduct(editProduct.id, { ...data, price: Number(data.price), stock: Number(data.stock) });
                    showToast(`Produk "${data.name}" berhasil diperbarui!`, 'success');
                } else {
                    await api.addProduct({ 
                        ...data, price: Number(data.price), stock: Number(data.stock), minOrder: 1, 
                        sellerId: currentUser.id, sellerName: currentUser.name, location: currentUser.location, 
                        image: 'https://images.unsplash.com/photo-1595841696677-6489ff3f8cd1?auto=format&fit=crop&q=80&w=800'

                loadData();

                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200"><p className="text-gray-500 text-sm font-medium mb-1">Produk di Etalase</p><p className="text-2xl font-bold text-gray-900">{sellerProducts.length}</p></div>

                            <button className={`py-4 px-6 font-bold text-sm transition-colors border-b-2 whitespace-nowrap ${activeTab === 'products' ? 'border-agrivo-600 text-agrivo-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`} onClick={() => setActiveTab('products')}><i className="fa-solid fa-box-open mr-2"></i> Etalase Produk ({sellerProducts.length})</button>

                                <table className="w-full text-left border-collapse">
                                    <thead><tr className="bg-white text-gray-500 text-xs uppercase tracking-wider border-b border-gray-100"><th className="p-5 font-semibold">Info Produk</th><th className="p-5 font-semibold">Harga Jual</th><th className="p-5 font-semibold">Stok</th><th className="p-5 font-semibold text-right">Aksi</th></tr></thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {sellerProducts.length === 0 ? <tr><td colSpan="4" className="p-10 text-center text-gray-500">Toko Anda belum memiliki produk.</td></tr> : 
                                        sellerProducts.map(p => (
                                            <tr key={p.id} className="hover:bg-gray-50/50 transition-colors">
                                                <td className="p-5">
                                                    <div className="flex items-center gap-4">
                                                        <img src={p.image} className="w-14 h-14 rounded-xl object-cover border border-gray-200 flex-shrink-0" />
                                                        <div><p className="font-bold text-gray-900 text-sm leading-tight">{p.name}</p><p className="text-xs text-gray-500 mt-1">{p.category}</p></div>
                                                    </div>
                                                </td>
                                                <td className="p-5 font-bold text-gray-900">{formatCurrency(p.price)} <span className="text-xs text-gray-400 font-normal">/{p.unit}</span></td>
                                                <td className="p-5"><Badge type={p.stock > 0 ? 'success' : 'danger'}>{p.stock} {p.unit}</Badge></td>
                                                <td className="p-5 text-right space-x-2">
                                                    <Button size="sm" variant="outline" className="text-xs px-3 py-1.5" onClick={() => { setEditProduct(p); setShowAddModal(true); }}><i className="fa-solid fa-pen"></i></Button>

                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>

                        {/* Tab Content: Orders */}
                        {activeTab === 'orders' && (

                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>

                        api.getProductsBySeller(data.sellerId, data.id).then(setOtherProducts);

                if(isOutOfStock) return;
                if(!currentUser) return showToast('Silakan login sebagai Pembeli terlebih dahulu.', 'error');
                if(currentUser.role !== 'BUYER') return showToast('Hanya akun Pembeli yang dapat membuat pesanan.', 'error');
                navigate(`/checkout/${product.id}?qty=${qty}`);
            };

            const handleAddToCart = async () => {
                if(isOutOfStock) return;

                if(currentUser.role !== 'BUYER') return showToast('Hanya akun Pembeli yang dapat menambahkan ke keranjang.', 'error');
                
                await api.addToCart(currentUser.id, product, qty);

                            </div>
                        </div>

                        {/* Product Info */}
                        <div className="w-full lg:w-1/2 p-6 md:p-8 lg:p-10 flex flex-col">

                                <div className="flex flex-col items-end">

                            <div className="text-3xl font-extrabold text-agrivo-600 mb-6 pb-6 border-b border-gray-100">{formatCurrency(product.price)} <span className="text-base font-semibold text-gray-400">/{product.unit}</span></div>
                            
                            <div className="grid grid-cols-2 gap-y-6 gap-x-8 mb-8 text-sm bg-gray-50 p-5 rounded-2xl border border-gray-100">

                            </div>

                                <img src={seller?.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(product.sellerName)}&background=c52020&color=fff`} className="w-20 h-20 md:w-24 md:h-24 rounded-full object-cover border-4 border-white shadow-md" alt={product.sellerName} />

            const phone = new URLSearchParams(location.search).get('phone') || '+628XXXXXXXXX';

            const handleVerify = async () => {
                if (otp.join('').length < 6) return showToast('Harap lengkapi kode 6 digit.', 'error');
                const response = await api.verifyOTP('u1', otp.join(''));
                if (response.success) { showToast('Verifikasi Berhasil!', 'success'); navigate('/login'); }

                            <div className="md:w-5/12 grid grid-cols-2 gap-4 w-full">
                                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 text-center"><h3 className="text-4xl md:text-5xl font-extrabold text-agrivo-600 mb-2">10rb+</h3><p className="text-gray-500 font-bold text-sm">Petani Bergabung</p></div>
                                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 text-center"><h3 className="text-4xl md:text-5xl font-extrabold text-agrivo-600 mb-2">50t+</h3><p className="text-gray-500 font-bold text-sm">Volume Komoditas</p></div>
                                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 text-center col-span-2"><h3 className="text-3xl md:text-4xl font-extrabold text-gray-900 mb-2 flex items-center justify-center">4.9 <i className="fa-solid fa-star text-yellow-500 ml-2"></i></h3><p className="text-gray-500 font-bold text-sm">Rata-rata Kepuasan Pengguna</p></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentUser, setCurrentUser] = useState(null); 
            const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
            const [cartCount, setCartCount] = useState(0);

            useEffect(() => {
                const updateCart = () => { if (currentUser?.role === 'BUYER') api.getCartByUser(currentUser.id).then(i => setCartCount(i.length)); else setCartCount(0); };
                updateCart(); window.addEventListener('cartUpdated', updateCart);
                return () => window.removeEventListener('cartUpdated', updateCart);
            }, [currentUser]);

            const showToast = (message, type = 'info') => { setToast({ show: true, message, type }); setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 4000); };
            const handleLogout = () => { setCurrentUser(null); showToast('Berhasil keluar dari akun.', 'success'); };

            const Toast = ({ message, type, onClose }) => {
                if (!message) return null;
                const bg = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-gray-800';
                return (
                    <div className={`fixed top-4 md:top-6 left-1/2 transform -translate-x-1/2 z-[9999] px-6 py-4 rounded-2xl shadow-2xl text-white font-bold flex items-center text-sm fade-in ${bg} min-w-[320px] max-w-[90vw] justify-between`}>
                        <div className="flex items-center gap-3">
                            {type === 'success' && <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><i className="fa-solid fa-check text-lg"></i></div>}
                            {type === 'error' && <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><i className="fa-solid fa-exclamation text-lg"></i></div>}
                            {type === 'info' && <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><i className="fa-solid fa-info text-lg"></i></div>}
                            <span className="leading-snug">{message}</span>
                        </div>
                        <button onClick={onClose} className="ml-4 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors"><i className="fa-solid fa-xmark"></i></button>
                    </div>
                );
            };

            const ProtectedRoute = ({ children, allowedRoles }) => {
                if (!currentUser) { setTimeout(() => showToast('Silakan masuk terlebih dahulu.', 'error'), 0); return <Navigate to="/login" replace />; }
                if (allowedRoles && !allowedRoles.includes(currentUser.role)) { setTimeout(() => showToast('Akses ditolak.', 'error'), 0); return <Navigate to="/" replace />; }
                return children;
            };

            return (
                <HashRouter>
                    <ScrollToTop />
                    <div className="min-h-screen flex flex-col relative">
                        <TopNavbar currentUser={currentUser} handleLogout={handleLogout} cartCount={cartCount} />
                        <main className="flex-grow w-full">
                            <Routes>
                                <Route path="/" element={<HomePage />} />
                                <Route path="/marketplace" element={<MarketplacePage />} />
                                <Route path="/businesses" element={<BusinessDirectoryPage />} />
                                <Route path="/login" element={<LoginPage showToast={showToast} onLoginSuccess={setCurrentUser} />} />
                                <Route path="/register" element={<RegisterPage showToast={showToast} />} />
                                <Route path="/verify" element={<VerifyOTPPage showToast={showToast} />} />
                                <Route path="/product/:id" element={<ProductDetailPage currentUser={currentUser} showToast={showToast} />} />
                                <Route path="/store/:id" element={<StorePage />} />
                                
                                {/* Protected Routes */}
                                <Route path="/profile" element={<ProtectedRoute><ProfilePage currentUser={currentUser} setCurrentUser={setCurrentUser} showToast={showToast} /></ProtectedRoute>} />
                                <Route path="/cart" element={<ProtectedRoute allowedRoles={['BUYER']}><CartPage currentUser={currentUser} showToast={showToast} /></ProtectedRoute>} />
                                <Route path="/checkout/:id" element={<ProtectedRoute allowedRoles={['BUYER']}><CheckoutPage currentUser={currentUser} showToast={showToast} /></ProtectedRoute>} />
                                <Route path="/buyer/orders" element={<ProtectedRoute allowedRoles={['BUYER']}><BuyerDashboard currentUser={currentUser} showToast={showToast} /></ProtectedRoute>} />
                                <Route path="/seller/dashboard" element={<ProtectedRoute allowedRoles={['SELLER']}><SellerDashboard currentUser={currentUser} showToast={showToast} /></ProtectedRoute>} />
                                <Route path="/admin" element={<ProtectedRoute allowedRoles={['ADMIN']}><AdminDashboard /></ProtectedRoute>} />
                                <Route path="/chat" element={<ProtectedRoute><ChatPage /></ProtectedRoute>} />
                                
                                <Route path="*" element={<div className="p-20 text-center"><h1 className="text-2xl font-bold">404 - Halaman tidak ditemukan.</h1><a href="/" className="inline-block mt-4 text-agrivo-600 font-bold hover:underline">Kembali ke Beranda</a></div>} />
                            </Routes>
                        </main>
                        <DesktopFooter />
                        <BottomMobileNav currentUser={currentUser} handleLogout={handleLogout} cartCount={cartCount} />
                        <AuthSwitcher currentUser={currentUser} setCurrentUser={setCurrentUser} handleLogout={handleLogout} />
                        {toast.show && <Toast message={toast.message} type={toast.type} onClose={() => setToast({show: false})} />}
                    </div>
                </HashRouter>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
