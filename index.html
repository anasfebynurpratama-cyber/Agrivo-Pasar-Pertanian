<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRIVO - Dari Petani, Untuk Indonesia</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        agrivo: {
                            50: '#fdf2f2',
                            100: '#fbe5e5',
                            200: '#f5caca',
                            300: '#efa2a2',
                            400: '#e56c6c',
                            500: '#db3e3e',
                            600: '#c52020', // Merah Dominan Logo AGRIVO
                            700: '#a51818',
                            800: '#881717',
                            900: '#721919',
                        },
                        agrivoGreen: {
                            500: '#2b7a1f', // Hijau Daun/Pertanian Logo
                        },
                        agrivoBlue: {
                            500: '#0070c0', // Biru Air/Perikanan Logo
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // 1. MOCK DATA LAYER (Simulating PostgreSQL/Laravel API)
        // ==========================================
        
        const MOCK_USERS = {
            buyer: { id: 'u1', name: 'Ahmad Pembeli', role: 'BUYER', avatar: 'https://i.pravatar.cc/150?u=u1' },
            seller: { id: 'u2', name: 'Pak Budi Farm', role: 'SELLER', avatar: 'https://i.pravatar.cc/150?u=u2', verified: true, location: 'Sidoarjo' },
            admin: { id: 'u3', name: 'Admin AGRIVO', role: 'ADMIN', avatar: 'https://i.pravatar.cc/150?u=u3' }
        };

        let MOCK_PRODUCTS = [
            { id: 'p1', sellerId: 'u2', sellerName: 'Pak Budi Farm', name: 'Cabai Merah Besar Premium', category: 'Cabai', price: 28000, unit: 'kg', stock: 500, minOrder: 10, location: 'Sidoarjo, Jawa Timur', rating: 4.9, image: 'https://images.unsplash.com/photo-1588880196853-53372c019d9b?auto=format&fit=crop&q=80&w=800', description: 'Cabai merah besar segar langsung dari kebun. Cocok untuk industri makanan dan restoran. Dipanen setiap pagi.', status: 'APPROVED' },
            { id: 'p2', sellerId: 'u2', sellerName: 'Tani Makmur', name: 'Jagung Pipilan Kering', category: 'Jagung', price: 6500, unit: 'kg', stock: 2000, minOrder: 50, location: 'Mojokerto, Jawa Timur', rating: 4.8, image: 'https://images.unsplash.com/photo-1601648764658-cf37e8c89b70?auto=format&fit=crop&q=80&w=800', description: 'Jagung pipilan kering kadar air 15%. Cocok untuk pakan ternak.', status: 'APPROVED' },
            { id: 'p3', sellerId: 'u4', sellerName: 'Sumber Rejeki', name: 'Beras Premium Mentik Wangi', category: 'Padi & Beras', price: 15000, unit: 'kg', stock: 1000, minOrder: 25, location: 'Jember, Jawa Timur', rating: 5.0, image: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&q=80&w=800', description: 'Beras premium tanpa pemutih dan pewangi buatan. Pulen dan wangi alami.', status: 'APPROVED' },
            { id: 'p4', sellerId: 'u5', sellerName: 'Agro Sejahtera', name: 'Tomat Segar Grade A', category: 'Sayuran', price: 12000, unit: 'kg', stock: 800, minOrder: 20, location: 'Malang, Jawa Timur', rating: 4.7, image: 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?auto=format&fit=crop&q=80&w=800', description: 'Tomat segar pilihan dari dataran tinggi Malang.', status: 'APPROVED' },
            { id: 'p5', sellerId: 'u6', sellerName: 'Mitra Tani Jaya', name: 'Pupuk NPK Mutiara', category: 'Pupuk', price: 350000, unit: 'sak', stock: 100, minOrder: 1, location: 'Surabaya, Jawa Timur', rating: 4.9, image: 'https://images.unsplash.com/photo-1628543105315-9988b49e1a38?auto=format&fit=crop&q=80&w=800', description: 'Pupuk NPK lengkap untuk masa vegetatif dan generatif.', status: 'APPROVED' },
        ];

        let MOCK_ORDERS = [
            { id: 'AGR-2026-000001', buyerId: 'u1', sellerId: 'u2', productId: 'p1', productName: 'Cabai Merah Besar Premium', qty: 50, price: 28000, subtotal: 1400000, fee: 10000, total: 1410000, status: 'PROCESSING', date: '2026-09-10' },
            { id: 'AGR-2026-000002', buyerId: 'u1', sellerId: 'u4', productId: 'p3', productName: 'Beras Premium Mentik Wangi', qty: 100, price: 15000, subtotal: 1500000, fee: 15000, total: 1515000, status: 'COMPLETED', date: '2026-09-01' }
        ];

        let MOCK_CHATS = [
            { id: 'c1', orderId: null, buyerId: 'u1', sellerId: 'u2', messages: [
                { senderId: 'u1', text: 'Pak, kalau ambil 500 kg harganya bisa kurang?', time: '10:00' },
                { senderId: 'u2', text: 'Bisa mas, kalau 500 kg saya kasih Rp26.000/kg.', time: '10:05' }
            ]}
        ];

        const MOCK_LOCATIONS = {
            provinces: [
                { id: '35', name: 'Jawa Timur' },
                { id: '33', name: 'Jawa Tengah' },
                { id: '32', name: 'Jawa Barat' }
            ],
            cities: {
                '35': [{ id: '3515', name: 'Kab. Sidoarjo' }, { id: '3578', name: 'Kota Surabaya' }, { id: '3573', name: 'Kota Malang' }],
                '33': [{ id: '3374', name: 'Kota Semarang' }, { id: '3308', name: 'Kab. Magelang' }],
                '32': [{ id: '3273', name: 'Kota Bandung' }, { id: '3201', name: 'Kab. Bogor' }]
            },
            districts: {
                '3515': [{ id: '351501', name: 'Waru' }, { id: '351502', name: 'Taman' }, { id: '351503', name: 'Sidoarjo' }],
                '3578': [{ id: '357801', name: 'Gubeng' }, { id: '357802', name: 'Wonokromo' }],
                '3573': [{ id: '357301', name: 'Klojen' }, { id: '357302', name: 'Lowokwaru' }]
            }
        };

        // ==========================================
        // 1.5. GEMINI AI INTEGRATION
        // ==========================================
        const geminiApi = {
            generateContent: async (contents, systemInstruction) => {
                const apiKey = ""; // Canvas runtime injects key here
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                const payload = { contents };
                if (systemInstruction) {
                    payload.systemInstruction = { parts: [{ text: systemInstruction }] };
                }

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    return result?.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf, terjadi kesalahan pemrosesan AI.";
                } catch (error) {
                    console.error("Gemini Error:", error);
                    return "Gagal terhubung ke layanan AI AGRIVO.";
                }
            }
        };

        // API Service Simulation
        const api = {
            getProducts: async (search = '', category = '') => {
                return MOCK_PRODUCTS.filter(p => 
                    (p.name.toLowerCase().includes(search.toLowerCase()) || p.category.toLowerCase().includes(search.toLowerCase())) &&
                    (category ? p.category === category : true)
                );
            },
            getProductById: async (id) => MOCK_PRODUCTS.find(p => p.id === id),
            createOrder: async (orderData) => {
                const newOrder = {
                    id: `AGR-2026-${String(MOCK_ORDERS.length + 1).padStart(6, '0')}`,
                    ...orderData,
                    status: 'PENDING',
                    date: new Date().toISOString().split('T')[0]
                };
                MOCK_ORDERS.unshift(newOrder);
                return newOrder;
            },
            getOrdersByUser: async (userId, role) => {
                return MOCK_ORDERS.filter(o => role === 'BUYER' ? o.buyerId === userId : o.sellerId === userId);
            },
            updateOrderStatus: async (orderId, newStatus) => {
                const order = MOCK_ORDERS.find(o => o.id === orderId);
                if(order) order.status = newStatus;
                return order;
            },
            
            register: async (payload) => {
                // Simulate network latency & server processing
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Server-side validation simulation (Security Layer)
                if (!payload.name || !payload.phone || !payload.password || !payload.provinceId) {
                    return { success: false, message: 'Validasi gagal: Harap lengkapi data wajib.' };
                }
                if (payload.password !== payload.confirmPassword) {
                    return { success: false, message: 'Validasi gagal: Konfirmasi password tidak cocok.' };
                }
                
                // Mock Uniqueness Check against Database
                if (payload.phone === '081234567890' || payload.phone === '+6281234567890') {
                    return { success: false, message: 'Nomor WhatsApp tersebut sudah terdaftar. Silakan masuk atau gunakan nomor lain.' };
                }

                // Simulate DB Insert (Users + Profiles + Businesses)
                const newUser = {
                    id: 'u' + Date.now(),
                    name: payload.name,
                    phone: payload.phone,
                    role: payload.role, 
                    avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(payload.name)}&background=c52020&color=fff`,
                    status: 'PENDING_VERIFICATION' // Strict state machine: requires OTP
                };
                
                // Return success without logging user in yet (redirect to verification required)
                return { success: true, message: 'Registrasi berhasil', data: { userId: newUser.id, phone: payload.phone } };
            },
            
            verifyOTP: async (userId, otp) => {
                // Simulate DB check for OTP validity
                await new Promise(resolve => setTimeout(resolve, 1000));
                if (otp === '123456') { // Mock valid OTP for Acceptance Test
                    return { success: true, message: 'Akun berhasil diverifikasi.' };
                }
                return { success: false, message: 'Kode OTP tidak valid atau telah kedaluwarsa.' };
            }
        };

        // ==========================================
        // 2. REUSABLE UI COMPONENTS
        // ==========================================

        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount);
        };

        const Badge = ({ children, type = 'default' }) => {
            const colors = {
                success: 'bg-green-100 text-green-800',
                warning: 'bg-yellow-100 text-yellow-800',
                danger: 'bg-red-100 text-red-800',
                info: 'bg-blue-100 text-blue-800',
                default: 'bg-gray-100 text-gray-800'
            };
            return <span className={`px-2 py-1 text-xs font-medium rounded-full ${colors[type]}`}>{children}</span>;
        };

        const Button = ({ children, variant = 'primary', className = '', onClick, disabled }) => {
            const baseStyle = "inline-flex items-center justify-center px-4 py-2 font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-agrivo-600 hover:bg-agrivo-700 text-white focus:ring-agrivo-500",
                secondary: "bg-agrivo-50 hover:bg-agrivo-100 text-agrivo-700 focus:ring-agrivo-500",
                outline: "border border-gray-300 bg-white hover:bg-gray-50 text-gray-700 focus:ring-agrivo-500",
                danger: "bg-red-600 hover:bg-red-700 text-white focus:ring-red-500"
            };
            return (
                <button disabled={disabled} onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

        const InputGroup = ({ label, type = 'text', value, onChange, placeholder, icon, required, error, disabled }) => {
            return (
                <div className="mb-4">
                    {label && <label className="block text-sm font-semibold text-gray-700 mb-1.5">{label} {required && <span className="text-red-500">*</span>}</label>}
                    <div className="relative">
                        {icon && <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"><i className={`fa-solid ${icon}`}></i></div>}
                        <input 
                            type={type} 
                            value={value} 
                            onChange={onChange} 
                            placeholder={placeholder}
                            disabled={disabled}
                            className={`w-full border ${error ? 'border-red-500 focus:ring-red-500' : 'border-gray-300 focus:ring-agrivo-600'} rounded-xl py-3 ${icon ? 'pl-10' : 'pl-4'} pr-4 outline-none focus:ring-2 focus:border-transparent transition-all disabled:bg-gray-50 disabled:text-gray-500 text-sm placeholder-gray-400`}
                        />
                    </div>
                    {error && <p className="mt-1.5 text-xs text-red-500 flex items-center"><i className="fa-solid fa-circle-exclamation mr-1.5"></i> {error}</p>}
                </div>
            );
        };

        const PasswordInput = ({ label, value, onChange, placeholder, required, error }) => {
            const [show, setShow] = useState(false);
            return (
                <div className="mb-4">
                    {label && <label className="block text-sm font-semibold text-gray-700 mb-1.5">{label} {required && <span className="text-red-500">*</span>}</label>}
                    <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400"><i className="fa-solid fa-lock"></i></div>
                        <input 
                            type={show ? 'text' : 'password'} 
                            value={value} 
                            onChange={onChange} 
                            placeholder={placeholder}
                            className={`w-full border ${error ? 'border-red-500 focus:ring-red-500' : 'border-gray-300 focus:ring-agrivo-600'} rounded-xl py-3 pl-10 pr-12 outline-none focus:ring-2 focus:border-transparent transition-all text-sm placeholder-gray-400`}
                        />
                        <button type="button" onClick={() => setShow(!show)} className="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none transition-colors">
                            <i className={`fa-regular ${show ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                        </button>
                    </div>
                    {error && <p className="mt-1.5 text-xs text-red-500 flex items-center"><i className="fa-solid fa-circle-exclamation mr-1.5"></i> {error}</p>}
                </div>
            );
        };

        const SelectGroup = ({ label, value, onChange, options, placeholder, required, error, disabled }) => {
            return (
                <div className="mb-4">
                    {label && <label className="block text-sm font-semibold text-gray-700 mb-1.5">{label} {required && <span className="text-red-500">*</span>}</label>}
                    <select 
                        value={value} 
                        onChange={onChange}
                        disabled={disabled}
                        className={`w-full border ${error ? 'border-red-500 focus:ring-red-500' : 'border-gray-300 focus:ring-agrivo-600'} rounded-xl py-3 px-4 outline-none focus:ring-2 focus:border-transparent transition-all disabled:bg-gray-50 text-sm bg-white appearance-none cursor-pointer`}
                        style={{ backgroundImage: 'url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%239CA3AF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E")', backgroundRepeat: 'no-repeat', backgroundPosition: 'right 1rem top 50%', backgroundSize: '.65rem auto' }}
                    >
                        <option value="" disabled>{placeholder}</option>
                        {options.map(opt => <option key={opt.id} value={opt.id}>{opt.name}</option>)}
                    </select>
                    {error && <p className="mt-1.5 text-xs text-red-500 flex items-center"><i className="fa-solid fa-circle-exclamation mr-1.5"></i> {error}</p>}
                </div>
            );
        };

        const ProductCard = ({ product, onClick }) => (
            <div onClick={onClick} className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow cursor-pointer flex flex-col h-full group">
                <div className="relative h-48 overflow-hidden bg-gray-100">
                    <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                    <div className="absolute top-2 right-2 bg-white/90 backdrop-blur-sm px-2 py-1 rounded-lg text-xs font-bold text-gray-700 flex items-center shadow-sm">
                        <i className="fa-solid fa-star text-yellow-400 mr-1"></i> {product.rating}
                    </div>
                </div>
                <div className="p-4 flex flex-col flex-grow">
                    <h3 className="font-semibold text-gray-800 line-clamp-2 mb-1">{product.name}</h3>
                    <p className="text-agrivo-600 font-bold text-lg mb-2">{formatCurrency(product.price)} <span className="text-sm font-normal text-gray-500">/{product.unit}</span></p>
                    
                    <div className="mt-auto space-y-2">
                        <div className="flex items-center text-xs text-gray-500">
                            <i className="fa-solid fa-location-dot mr-1.5 w-3 text-center"></i>
                            <span className="truncate">{product.location}</span>
                        </div>
                        <div className="flex items-center text-xs text-gray-500">
                            <i className="fa-solid fa-box mr-1.5 w-3 text-center"></i>
                            Stok: {product.stock} {product.unit}
                        </div>
                        <div className="flex items-center text-xs text-gray-500">
                            <i className="fa-solid fa-shop mr-1.5 w-3 text-center"></i>
                            <span className="truncate">{product.sellerName}</span>
                        </div>
                    </div>
                </div>
            </div>
        );

        // ==========================================
        // 3. PAGES
        // ==========================================

        const RegisterPage = ({ navigate }) => {
            const [role, setRole] = useState('BUYER');
            const [formData, setFormData] = useState({
                name: '', phone: '', email: '', password: '', confirmPassword: '',
                provinceId: '', cityId: '', districtId: '',
                businessName: '', businessType: ''
            });
            const [errors, setErrors] = useState({});
            const [agreed, setAgreed] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [serverError, setServerError] = useState('');

            // Nested Location Logic (Frontend Validation State)
            const provinces = MOCK_LOCATIONS.provinces;
            const cities = formData.provinceId ? MOCK_LOCATIONS.cities[formData.provinceId] || [] : [];
            const districts = formData.cityId ? MOCK_LOCATIONS.districts[formData.cityId] || [] : [];

            // Password strength calculator (Security UX Requirement)
            const getPasswordStrength = (pass) => {
                let score = 0;
                if (pass.length >= 8) score += 1;
                if (/[A-Z]/.test(pass)) score += 1;
                if (/[a-z]/.test(pass)) score += 1;
                if (/[0-9]/.test(pass)) score += 1;
                return score; // Range: 0 to 4
            };
            const pwdScore = getPasswordStrength(formData.password);

            const handleChange = (e, field) => {
                setFormData(prev => ({ ...prev, [field]: e.target.value }));
                
                // Cascade drop-downs logic
                if (field === 'provinceId') setFormData(prev => ({ ...prev, cityId: '', districtId: '' }));
                if (field === 'cityId') setFormData(prev => ({ ...prev, districtId: '' }));
                
                // Clear error state proactively as user types
                if (errors[field]) setErrors(prev => ({ ...prev, [field]: null }));
                if (serverError) setServerError('');
            };

            const validateForm = () => {
                const newErrs = {};
                // Name Validation
                if (!formData.name || formData.name.length < 3) newErrs.name = 'Nama lengkap minimal 3 karakter';
                
                // Indonesian Phone Number Validation (Regex)
                if (!formData.phone || !/^(\+62|62|0)8[1-9][0-9]{6,10}$/.test(formData.phone)) {
                    newErrs.phone = 'Format nomor handphone tidak valid (contoh: 0812...)';
                }
                
                // Optional Email Validation
                if (formData.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email)) {
                    newErrs.email = 'Format email tidak valid';
                }

                // Password Policy
                if (pwdScore < 4) newErrs.password = 'Password minimal 8 karakter, mengandung huruf besar, kecil, dan angka';
                if (formData.password !== formData.confirmPassword) newErrs.confirmPassword = 'Konfirmasi password tidak cocok';
                
                // Location Policy
                if (!formData.provinceId) newErrs.provinceId = 'Provinsi wajib dipilih';
                if (!formData.cityId) newErrs.cityId = 'Kota/Kabupaten wajib dipilih';
                
                // Seller Specific Policy
                if (role === 'SELLER') {
                    if (!formData.businessName) newErrs.businessName = 'Nama Usaha wajib diisi';
                    if (!formData.businessType) newErrs.businessType = 'Jenis Usaha wajib dipilih';
                }

                setErrors(newErrs);
                return Object.keys(newErrs).length === 0;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!validateForm()) return;
                if (!agreed) return setServerError('Anda harus menyetujui Syarat & Ketentuan serta Kebijakan Privasi.');

                setIsLoading(true);
                try {
                    // Pre-process phone formatting (Normalize to +62 format before sending to DB)
                    let formattedPhone = formData.phone;
                    if (formattedPhone.startsWith('0')) formattedPhone = '+62' + formattedPhone.substring(1);
                    else if (formattedPhone.startsWith('62')) formattedPhone = '+' + formattedPhone;

                    const payload = { ...formData, phone: formattedPhone, role };
                    const response = await api.register(payload);
                    
                    if (response.success) {
                        // Routing to standard OTP verify flow (prevent direct login)
                        navigate(`/verify?userId=${response.data.userId}&phone=${encodeURIComponent(formattedPhone)}`);
                    } else {
                        setServerError(response.message);
                    }
                } catch (err) {
                    setServerError('Koneksi bermasalah. Periksa internet Anda dan coba kembali.');
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex fade-in">
                    {/* Left Branding Area (Desktop Only) - Split Layout */}
                    <div className="hidden lg:flex w-5/12 relative flex-col justify-between p-14 overflow-hidden">
                        {/* Background Overlay */}
                        <div className="absolute inset-0 bg-agrivo-900">

            const [otp, setOtp] = useState(['', '', '', '', '', '']);
            const [timer, setTimer] = useState(30);
            const [error, setError] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            
            // Extract parameters from URL safely in SPA mode
            const params = new URLSearchParams(route.split('?')[1]);
            const phone = params.get('phone') || '+628XXXXXXXXX';
            const userId = params.get('userId');
            
            const inputs = React.useRef([]);

            useEffect(() => {
                let interval = setInterval(() => {
                    setTimer(prev => prev > 0 ? prev - 1 : 0);
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            const handleChange = (e, index) => {
                const val = e.target.value;
                if (/[^0-9]/.test(val)) return; // Strict numeric constraint
                
                const newOtp = [...otp];
                newOtp[index] = val;
                setOtp(newOtp);

                // Auto-advance cursor
                if (val && index < 5) inputs.current[index + 1].focus();
            };

            const handleKeyDown = (e, index) => {
                // Auto-backspace cursor
                if (e.key === 'Backspace' && !otp[index] && index > 0) {
                    inputs.current[index - 1].focus();
                }
            };

            const handleVerify = async () => {
                const code = otp.join('');
                if (code.length < 6) return setError('Harap masukkan 6 digit kode secara lengkap.');
                
                setIsLoading(true);
                setError('');
                try {
                    const response = await api.verifyOTP(userId, code);
                    if (response.success) {
                        // User successfully verified. Ready for onboarding.
                        alert('✅ Verifikasi Berhasil! Akun aktif. Mengarahkan Anda ke Dashboard...');
                        navigate('/marketplace'); 
                    } else {
                        setError(response.message);
                    }
                } catch (e) {
                    setError('Koneksi bermasalah. Periksa internet Anda.');
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4 fade-in relative overflow-hidden">
                    {/* Background Decor */}
                    <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-agrivo-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-agrivoGreen-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>

                            <i className="fa-solid fa-shield-check"></i>
                        </div>
                        <h2 className="text-3xl font-bold text-gray-900 mb-3 tracking-tight">Verifikasi OTP</h2>
                        <p className="text-gray-500 text-sm mb-8 leading-relaxed">
                            Demi keamanan, kami telah mengirimkan 6 digit kode rahasia ke WhatsApp <br/>
                            <span className="font-bold text-gray-900 bg-gray-100 px-2 py-1 rounded-md mt-2 inline-block">{phone}</span>
                        </p>

                        {error && <div className="mb-8 p-3 bg-red-50 text-red-600 text-sm font-medium rounded-xl border border-red-100 fade-in">{error}</div>}

                        <div className="flex justify-center gap-2 sm:gap-3 mb-10 direction-ltr">
                            {otp.map((digit, i) => (
                                <input
                                    key={i}
                                    ref={el => inputs.current[i] = el}
                                    type="text"
                                    maxLength="1"
                                    value={digit}
                                    onChange={e => handleChange(e, i)}
                                    onKeyDown={e => handleKeyDown(e, i)}
                                    className="w-11 h-14 sm:w-14 sm:h-16 border border-gray-300 rounded-xl text-center text-2xl font-bold focus:border-agrivo-600 focus:ring-2 focus:ring-agrivo-500 outline-none transition-all bg-gray-50 focus:bg-white text-gray-900"
                                />
                            ))}
                        </div>

                        <Button onClick={handleVerify} disabled={isLoading || otp.join('').length < 6} className="w-full py-4 text-lg rounded-xl shadow-md mb-8">
                            {isLoading ? <i className="fa-solid fa-circle-notch fa-spin"></i> : 'Verifikasi Akun Saya'}
                        </Button>

                        <div className="text-sm text-gray-500 border-t border-gray-100 pt-6">
                            Belum menerima kode OTP? <br className="sm:hidden" />
                            {timer > 0 ? (
                                <span className="text-gray-400 mt-1 inline-block">Kirim ulang tersedia dalam <b>{timer}s</b></span>
                            ) : (
                                <button onClick={() => { setTimer(30); alert('Kode OTP baru telah dikirimkan (Simulasi). Gunakan 123456 untuk testing.'); }} className="font-bold text-agrivo-600 hover:text-agrivo-700 hover:underline mt-1 inline-block transition-colors">Kirim Ulang Kode Sekarang</button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

                            <h2 className="text-2xl font-bold text-gray-900 mb-6">Temukan Kebutuhan Pertanian</h2>
                            <div className="grid grid-cols-4 md:grid-cols-8 gap-4">
                                {categories.map(c => (
                                    <div key={c.name} onClick={() => navigate('/marketplace')} className="bg-white border border-gray-100 p-4 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:shadow-md hover:border-agrivo-200 transition-all group">

                        {/* Featured Products */}

                                    <ProductCard key={p.id} product={p} onClick={() => navigate(`/product/${p.id}`)} />
                                ))}

                        {/* Trust Section */}
                        <div className="bg-agrivo-50 rounded-3xl p-8 md:p-12 flex flex-col md:flex-row items-center justify-between border border-agrivo-100">
                            <div className="md:w-1/2 mb-8 md:mb-0">

                                <p className="text-gray-600 text-lg mb-6 leading-relaxed">
                                    Setiap penjual di AGRIVO melalui proses verifikasi ketat. Dana Anda aman bersama kami hingga pesanan selesai dan diterima dengan baik.

                e.preventDefault();
                if (!input.trim() || isTyping) return;

                const userMsg = input.trim();
                setInput('');
                
                const newHistory = [...messages, { role: 'user', text: userMsg }];
                setMessages(newHistory);
                setIsTyping(true);

                const sysInstruction = "Anda adalah AgriBot, asisten virtual dan AI resmi dari platform marketplace AGRIVO (Dari Petani Untuk Indonesia). Anda ramah, sangat cerdas, dan ahli dalam bidang pertanian Indonesia. Tugas Anda adalah membantu user mencari barang di AGRIVO, memberikan tips pertanian, info cuaca/musim tanam, dan panduan platform. Jawab dengan paragraf yang singkat, padat, dan format yang rapi. Gunakan emoji agar lebih interaktif.";
                
                const apiContents = newHistory.map(msg => ({
                    role: msg.role,
                    parts: [{ text: msg.text }]
                }));

                                    <div className="flex space-x-4 text-gray-400">
                                        <i className="fa-brands fa-instagram hover:text-agrivo-600 cursor-pointer"></i>
                                        <i className="fa-brands fa-facebook hover:text-agrivo-600 cursor-pointer"></i>
                                        <i className="fa-brands fa-linkedin hover:text-agrivo-600 cursor-pointer"></i>
                                    </div>
                                </div>
                                <div>
                                    <h4 className="font-bold text-gray-900 mb-4">Layanan</h4>
                                    <ul className="space-y-2 text-sm text-gray-500">
                                        <li className="hover:text-agrivo-600 cursor-pointer" onClick={() => navigate('/marketplace')}>Pasar Pertanian</li>
                                        <li className="hover:text-agrivo-600 cursor-pointer">Kebutuhan Pertanian</li>
                                        <li className="hover:text-agrivo-600 cursor-pointer">AGRIVO Jobs</li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-bold text-gray-900 mb-4">Bantuan</h4>
                                    <ul className="space-y-2 text-sm text-gray-500">
                                        <li className="hover:text-agrivo-600 cursor-pointer">Cara Belanja</li>
                                        <li className="hover:text-agrivo-600 cursor-pointer">Mulai Berjualan</li>
                                        <li className="hover:text-agrivo-600 cursor-pointer">Hubungi Kami</li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-bold text-gray-900 mb-4">Keamanan</h4>
                                    <div className="flex items-center gap-2 mb-2">
                                        <i className="fa-solid fa-shield-check text-agrivo-500"></i>
                                        <span className="text-sm text-gray-500">Pembayaran Aman</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <i className="fa-solid fa-user-check text-agrivo-500"></i>
                                        <span className="text-sm text-gray-500">Pengguna Terverifikasi</span>

                                </div>
                            </div>
                            <div className="border-t border-gray-100 mt-12 pt-8 text-center text-sm text-gray-400">

                            </div>
                        </div>
                    </footer>

                    {/* Mobile Bottom Navigation (Mobile-First approach) */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center h-16 z-50 pb-[env(safe-area-inset-bottom)]">
                        <button onClick={() => navigate('/')} className={`flex flex-col items-center justify-center w-full h-full ${route==='/' ? 'text-agrivo-600' : 'text-gray-400'}`}>
                            <i className="fa-solid fa-house text-xl mb-1"></i>
                            <span className="text-[10px] font-medium">Home</span>
                        </button>
                        <button onClick={() => navigate('/marketplace')} className={`flex flex-col items-center justify-center w-full h-full ${route==='/marketplace' ? 'text-agrivo-600' : 'text-gray-400'}`}>
                            <i className="fa-solid fa-store text-xl mb-1"></i>
                            <span className="text-[10px] font-medium">Pasar</span>
                        </button>
                        {currentUser?.role === 'BUYER' && (
                            <button onClick={() => navigate('/buyer/orders')} className={`flex flex-col items-center justify-center w-full h-full ${route==='/buyer/orders' ? 'text-agrivo-600' : 'text-gray-400'}`}>
                                <i className="fa-solid fa-receipt text-xl mb-1"></i>
                                <span className="text-[10px] font-medium">Pesanan</span>
                            </button>
                        )}
                        {currentUser?.role === 'SELLER' && (
                            <button onClick={() => navigate('/seller/dashboard')} className={`flex flex-col items-center justify-center w-full h-full ${route==='/seller/dashboard' ? 'text-agrivo-600' : 'text-gray-400'}`}>

                            <span className="absolute top-2 right-4 w-2 h-2 bg-red-500 rounded-full"></span>

                        </button>
                        <button onClick={() => {

                            else { setCurrentUser(null); navigate('/'); }
                        }} className="flex flex-col items-center justify-center w-full h-full text-gray-400">
                            <i className="fa-regular fa-user text-xl mb-1"></i>
                            <span className="text-[10px] font-medium">{currentUser ? 'Keluar' : 'Profil'}</span>

                    <AuthSwitcher />
                    <AgriBot />

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
